format:
  line_width: 100
  tab_size: 2
  use_tabchars: false

  max_pargs_hwrap: 3
  max_subgroups_hwrap: 2
  # 0.6.13 replacement for old "max_subargs_per_line" behavior
  max_rows_cmdline: 1

  dangle_parens: true
  separate_ctrl_name_with_space: false
  dangle_align: prefix

  enable_sort: true
  autosort: true

  command_case: lower
  keyword_case: upper

  always_wrap:
    - add_executable
    - add_library
    - target_sources
    - target_link_libraries
    - target_include_directories
    - target_compile_definitions
    - target_compile_options

  max_lines_hwrap: 2

markup:
  enable_markup: false
